name: Contribution Invaders

on:
  schedule:
    - cron: "17 16 * * *"   # daily at 00:17 Philippine time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/contrib_invaders.py
      - .github/workflows/contrib-invaders.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render SVG
        env:
          # GitHub groups contribution days by the viewer's timezone. The built-in
          # token sees UTC days; a personal token sees them as you do on your profile.
          GITHUB_TOKEN: ${{ secrets.CONTRIB_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/contrib_invaders.py "${{ github.repository_owner }}" dist/contrib-invaders.svg

      - name: Publish to the output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-invaders.svg
          git commit -q -m "Update contribution invaders"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
